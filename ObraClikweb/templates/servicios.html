<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObraClick - Sobre Nosotros</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="d-flex flex-column min-vh-100 obraclick-theme">

    <!-- NAVBAR NAVEGACIÓN CLIENTE -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 sticky-top shadow-sm">
        <div class="container-fluid px-4">
            
            <!-- LOGO OBRACLICK -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='img/ObraClick logo.png') }}" alt="ObraClick Logo" height="36">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#userNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="userNavbar">
                <!-- ENLACES PRINCIPALES -->
                <ul class="navbar-nav me-auto ms-lg-4 gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link text-white text-uppercase" href="{{ url_for('index') }}">INICIO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white text-uppercase" href="{{ url_for('nosotros') }}">NOSOTROS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white text-uppercase" href="{{ url_for('servicios') }}">SERVICIOS</a>
                    </li>
                </ul>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm fw-bold px-3">
                        Ingresar
                    </a>
                    <a href="{{ url_for('registro') }}" class="btn btn-warning btn-sm fw-bold px-3 text-dark">
                        Inscribirse
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-4 flex-grow-1">
        
        <!-- BARRA DE BÚSQUEDA CENTRADA -->
        <div class="row justify-content-center mb-5">
            <div class="col-lg-8">
                <form action="{{ url_for('servicios') }}" method="GET" class="position-relative">
                    <div class="input-group input-group-lg rounded-pill overflow-hidden shadow-sm border">
                        <span class="input-group-text bg-secondary-subtle border-0 pe-2 ps-4">
                            <i class="fa-solid fa-magnifying-glass text-dark fs-4"></i>
                        </span>
                        <input type="text" name="q" class="form-control bg-secondary-subtle border-0 fs-5 text-dark" placeholder="Buscar especialista, oficio o servicio..." aria-label="Buscar">
                    </div>
                </form>
            </div>
        </div>

        <!-- REJILLA DE SERVICIOS -->
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    {% for servicio in servicios %}
    <div class="col">
        <!-- CAMBIO AQUÍ: Redirección al detalle del perfil -->
        <a href="{{ url_for('perfil') }}" class="text-decoration-none text-dark">
            <div class="card h-100 border-0 bg-white rounded-3 shadow-sm hover-shadow transition overflow-hidden">
                
                <!-- CONTENEDOR DE LA IMAGEN DEL SERVICIO -->
                <div class="position-relative overflow-hidden" style="height: 180px;">
                    <img src="{{ url_for('static', filename='img/' ~ servicio.imagen) }}" 
                         class="card-img-top w-100 h-100 object-fit-cover" 
                         alt="{{ servicio.titulo }}">
                </div>

                <!-- CUERPO DE LA TARJETA -->
                <div class="card-body p-3 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <i class="fa-solid fa-circle-user text-secondary fs-6"></i>
                            <span class="fw-semibold small text-muted">Especialista ObraClick</span>
                        </div>
                        <h6 class="card-title fw-bold text-dark mb-2">
                            {{ servicio.titulo }}
                        </h6>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
                        <span class="small text-warning fw-bold">
                            <i class="fa-solid fa-star"></i> 4.9 <span class="text-muted fw-normal">(15)</span>
                        </span>
                        <span class="fw-bold text-dark fs-6">
                            Desde ${{ servicio.precio }}
                        </span>
                    </div>
                </div>

            </div>
        </a>
    </div>
    {% endfor %}
</div>

    </main>

    <!-- FOOTER -->
    <footer class="footer-fiverr py-3 border-top bg-white">
        <div class="container-fluid px-4">
            <div class="row align-items-center justify-content-between gy-2">
                <div class="col-12 col-md-auto text-center text-md-start">
                    <span class="text-secondary small fw-medium">
                        &copy; 2026 <strong>ObraClick S.A.S.</strong> | Carlos Arce - <strong>UEA</strong>
                    </span>
                </div>
                <div class="col-12 col-md-auto d-flex flex-wrap align-items-center justify-content-center gap-3">
                    <div class="social-icons d-flex align-items-center gap-3 text-secondary">
                        <a href="https://tiktok.com" target="_blank" class="text-secondary text-decoration-none hover-icon"><i class="fa-brands fa-tiktok fs-5"></i></a>
                        <a href="https://instagram.com" target="_blank" class="text-secondary text-decoration-none hover-icon"><i class="fa-brands fa-instagram fs-5"></i></a>
                        <a href="https://linkedin.com" target="_blank" class="text-secondary text-decoration-none hover-icon"><i class="fa-brands fa-linkedin-in fs-5"></i></a>
                        <a href="https://facebook.com" target="_blank" class="text-secondary text-decoration-none hover-icon"><i class="fa-brands fa-facebook-f fs-5"></i></a>
                    </div>
                    <div class="d-flex align-items-center gap-3 ms-md-2 ps-md-3 border-start-md text-secondary small fw-semibold">
                        <a href="#" class="text-secondary text-decoration-none d-flex align-items-center gap-1 hover-link">
                            <i class="fa-solid fa-globe fs-6"></i> Español
                        </a>
                        <a href="#" class="text-secondary text-decoration-none hover-link">$ USD</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
